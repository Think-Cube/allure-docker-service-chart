{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "allure.uiName" . }}
  labels:
    {{- include "allure.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "allure.selectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "allure.selectorLabels" (dict "root" . "component" "ui") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "allure.podSpec" . | nindent 6 }}
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5252
              protocol: TCP
          env:
            - name: ALLURE_DOCKER_PUBLIC_API_URL
              value: {{ include "allure.publicApiUrl" . | quote }}
            {{- with .Values.api.urlPrefix }}
            - name: ALLURE_DOCKER_PUBLIC_API_URL_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ui.urlPrefix }}
            - name: URL_PREFIX
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
