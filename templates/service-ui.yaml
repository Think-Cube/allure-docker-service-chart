{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "allure.uiName" . }}
  labels:
    {{- include "allure.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.uiPort }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "allure.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
{{- end }}
