apiVersion: v1
kind: Service
metadata:
  name: {{ include "allure.apiName" . }}
  labels:
    {{- include "allure.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.apiPort }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "allure.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
