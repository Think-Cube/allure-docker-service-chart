{{- if and .Values.api.security.enabled (not .Values.api.security.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "allure.secretName" . }}
  labels:
    {{- include "allure.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  SECURITY_USER: {{ required "api.security.adminUser is required when api.security.enabled is true and api.security.existingSecret is empty" .Values.api.security.adminUser | quote }}
  SECURITY_PASS: {{ required "api.security.adminPassword is required when api.security.enabled is true and api.security.existingSecret is empty" .Values.api.security.adminPassword | quote }}
  {{- with .Values.api.security.viewerUser }}
  SECURITY_VIEWER_USER: {{ . | quote }}
  SECURITY_VIEWER_PASS: {{ required "api.security.viewerPassword is required when api.security.viewerUser is set" $.Values.api.security.viewerPassword | quote }}
  {{- end }}
{{- end }}
